name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only by default. Nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs, at least two weeks old when picked. Dependabot proposes bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No packages and no network: the tests load the model from index.html and feed it made-up weather.
      # Uses the Node that ships on the runner, so there is nothing to install.
      - name: Test
        run: node --version && node --test test/core.test.js

      - name: Functions parse
        run: node --check api/army-maps.js && node --check api/weather.js

      # The Vercel link, pulled env files and stored weather must never be committed.
      - name: No personal files
        run: |
          if git ls-files | grep -E '(^|/)\.env|^\.vercel/|winds-snapshot\.json$|^\.claude/'; then
            echo "::error::A file that should stay on your machine is tracked. See .gitignore."
            exit 1
          fi
